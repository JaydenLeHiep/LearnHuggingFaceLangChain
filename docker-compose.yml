services:
  db:
    image: postgres:13
    container_name: llm_chat_database
    environment:
      POSTGRES_DB: llm_chat_database
      POSTGRES_USER: hieple
      POSTGRES_PASSWORD: hieple
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - plus_network

networks:
  plus_network:
    driver: bridge

volumes:
  db_data:

